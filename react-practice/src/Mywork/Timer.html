<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Typing Skill Assessment – Fixed Counters</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <style>
      #typingBox {
        height: 220px;
        font-size: 1.1rem;
        border: 2px dashed #9aa0a6;
        padding: 14px;
        resize: none;
      }
      .stat {
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body class="p-4">
    <h3 class="mb-2">Typing Skill Assessment</h3>

    <div class="mb-3">
      <strong>Clock:</strong> <span id="clock" class="stat">--:--:--</span
      ><br />
      <strong>Timer:</strong> <span id="timer" class="stat">00:00:00</span>
    </div>

    <textarea
      id="typingBox"
      class="form-control"
      placeholder="Start typing here..."
    ></textarea>

    <hr />

    <div class="row g-3">
      <div class="col-md-4">
        <h5>Totals</h5>
        <div>Words: <span id="wordsTotal" class="stat">0</span></div>
        <div>Characters: <span id="charsTotal" class="stat">0</span></div>
        <div>Sentences: <span id="sentsTotal" class="stat">0</span></div>
      </div>
      <div class="col-md-4">
        <h5>Per Second</h5>
        <div>Words / sec: <span id="wps" class="stat">0</span></div>
        <div>Chars / sec: <span id="cps" class="stat">0</span></div>
        <div>Sentences / sec: <span id="sps" class="stat">0</span></div>
      </div>
      <div class="col-md-4">
        <h5>Per Minute</h5>
        <div>Words / min: <span id="wpm" class="stat">0</span></div>
        <div>Chars / min: <span id="cpm" class="stat">0</span></div>
        <div>Sentences / min: <span id="spm" class="stat">0</span></div>
      </div>
    </div>

    <button id="resetBtn" class="btn btn-danger mt-3">RESET</button>

    <script>
      /* ================= CLOCK ================= */
      const clockEl = document.getElementById("clock");
      setInterval(() => {
        clockEl.textContent = new Date().toLocaleTimeString();
      }, 1000);

      /* =============== ELEMENTS =============== */
      const box = document.getElementById("typingBox");
      const timerEl = document.getElementById("timer");

      const wordsTotalEl = document.getElementById("wordsTotal");
      const charsTotalEl = document.getElementById("charsTotal");
      const sentsTotalEl = document.getElementById("sentsTotal");

      const wpsEl = document.getElementById("wps");
      const cpsEl = document.getElementById("cps");
      const spsEl = document.getElementById("sps");

      const wpmEl = document.getElementById("wpm");
      const cpmEl = document.getElementById("cpm");
      const spmEl = document.getElementById("spm");

      /* ============== TIMER STATE ============== */
      let seconds = 0;
      let tick = null;

      function fmt(sec) {
        const h = String(Math.floor(sec / 3600)).padStart(2, "0");
        const m = String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
        const s = String(sec % 60).padStart(2, "0");
        return `${h}:${m}:${s}`;
      }

      /* ============ COUNTING HELPERS ============ */
      function countWords(text) {
        const matches = text.match(
          /\b[\p{L}\p{N}]+(?:[’'\-][\p{L}\p{N}]+)*\b/gu
        );
        return matches ? matches.length : 0;
      }

      function countSentences(text) {
        const trimmed = text.trim();
        if (!trimmed) return 0;

        // Count ended sentences:
        const ended = (trimmed.match(/[^.!?]+[.!?]+(?=\s|$)/g) || []).length;

        const lastHasNoPunct =
          /[^.!?]+$/.test(trimmed) && !/[.!?]\s*$/.test(trimmed);
        const lastChunkHasContent = /[\p{L}\p{N}]/u.test(
          trimmed.split(/[.!?]+/).pop() || ""
        );

        return ended + (lastHasNoPunct && lastChunkHasContent ? 1 : 0);
      }

      function countChars(text) {
        return text.length;

       
      }

      function safeRate(n, secs) {
        if (!secs || secs <= 0) return 0;
        return n / secs;
      }

      function updateStats() {
        const text = box.value;

        const words = countWords(text);
        const chars = countChars(text);
        const sents = countSentences(text);

        // Totals
        wordsTotalEl.textContent = words;
        charsTotalEl.textContent = chars;
        sentsTotalEl.textContent = sents;

        // Rates
        const wps = safeRate(words, seconds);
        const cps = safeRate(chars, seconds);
        const sps = safeRate(sents, seconds);

        wpsEl.textContent = wps.toFixed(2);
        cpsEl.textContent = cps.toFixed(2);
        spsEl.textContent = sps.toFixed(3); // sentences change slower

        wpmEl.textContent = (wps * 60).toFixed(2);
        cpmEl.textContent = (cps * 60).toFixed(2);
        spmEl.textContent = (sps * 60).toFixed(2);
      }

      /* =============== TIMER HOOKS =============== */
      box.addEventListener("focus", () => {
        if (!tick) {
          tick = setInterval(() => {
            seconds++;
            timerEl.textContent = fmt(seconds);
            updateStats(); // also refresh every second
          }, 1000);
        }
      });

      box.addEventListener("input", updateStats); // live update while typing

      box.addEventListener("blur", () => {
        clearInterval(tick);
        tick = null;
        updateStats(); // final snapshot on blur
      });

      /* ================= RESET ================= */
      document.getElementById("resetBtn").addEventListener("click", () => {
        clearInterval(tick);
        tick = null;
        seconds = 0;
        box.value = "";
        timerEl.textContent = "00:00:00";
        updateStats();
      });

      // Initial paint
      updateStats();
    </script>
  </body>
</html>
